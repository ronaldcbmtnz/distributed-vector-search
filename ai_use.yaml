# Declaración de uso de IA, en el formato que pide la metodología del curso
# (ai_use: used / tools / activities / verification). Cubre a TODO el equipo.
# Principio del curso: se puede delegar trabajo a la IA, no la responsabilidad por su corrección.
# Cada integrante debe poder explicar y modificar cualquier parte entregada, incluida la asistida.
ai_use:
  used: true
  tools:
    - Claude Code (Anthropic, Claude Opus 5.5)   # integrante A: sistema (core, coordinador, Ray, API)
    - Codex (OpenAI, GPT-6)                      # integrante B: cliente, stub, datos, despliegue, experimentos
  activities:
    - requirements analysis and planning (spec-driven development)
    - architecture discussion
    - implementation
    - debugging
    - test generation
    - cross code review
    - technical documentation
  verification:
    - public tests (make test, make test-contract)
    - integration tests on a local Ray cluster (make test-integration)
    - property-based tests (hypothesis)
    - contract tests against the stub and against the Ray gateway
    - fault/workload campaign (experiments/)
    - static checks (ruff, mypy --strict on core and coordinator)
    - manual review
